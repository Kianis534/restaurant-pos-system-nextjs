name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages needs a public repository on the free plan, so skip quietly while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      # Project sites live at https://<user>.github.io/<repo>/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
      # Unset variables are empty, and the app falls back to its defaults.
      NEXT_PUBLIC_APP_NAME: ${{ vars.APP_NAME }}
      NEXT_PUBLIC_CURRENCY: ${{ vars.CURRENCY }}
      NEXT_PUBLIC_LOCALE: ${{ vars.LOCALE }}
      NEXT_PUBLIC_ADMIN_PASSWORD_HASH: ${{ vars.ADMIN_PASSWORD_HASH }}
      NEXT_PUBLIC_STAFF_PASSWORD_HASH: ${{ vars.STAFF_PASSWORD_HASH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      # Deploying from an artifact skips Jekyll, so the _next folder is served as-is.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
