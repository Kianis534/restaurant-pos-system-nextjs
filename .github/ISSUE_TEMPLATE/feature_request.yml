name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation at the till, in the kitchen or in the back office.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead
